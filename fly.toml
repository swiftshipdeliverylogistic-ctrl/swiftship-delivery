app = "swiftship-delivery"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[mounts]]
  source = "swiftship_data"
  destination = "/data"
  initial_size = "1gb"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_PATH = "/data/swiftship.db"